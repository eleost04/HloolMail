name: hloolmail

services:
  app:
    image: ${HLOOLMAIL_IMAGE:-ghcr.io/hloolx/hloolmail:latest}
    ports:
      - "${HTTP_PORT:-127.0.0.1:3000}:3000"
      - "${SMTP_PORT:-25}:2525"
    environment:
      HTTP_ADDR: ":3000"
      SMTP_ADDR: ":2525"
      HLOOLMAIL_DEPLOYMENT: "docker"
      HLOOLMAIL_CONFIG_LOCKED: "true"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://email.eleost.com}"
      PUBLIC_INDEXING: "${PUBLIC_INDEXING:-landing}"
      MAIL_HOSTNAME: "${MAIL_HOSTNAME:-mail.eleost.com}"
      EXPECTED_MX: "${EXPECTED_MX:-mail.eleost.com}"
      MX_STRICT: "${MX_STRICT:-false}"
      DATABASE_DRIVER: "postgres"
      DATABASE_URL: "postgres://${POSTGRES_USER:-hloolmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hloolmail}?sslmode=disable"
      MESSAGE_RETENTION_HOURS: "${MESSAGE_RETENTION_HOURS:-24}"
      AUDIT_LOG_RETENTION_DAYS: "${AUDIT_LOG_RETENTION_DAYS:-180}"
      AUDIT_ACTIVITY_RETENTION_DAYS: "${AUDIT_ACTIVITY_RETENTION_DAYS:-30}"
      WEBHOOKS_ENABLED: "${WEBHOOKS_ENABLED:-true}"
      MAX_MESSAGE_BYTES: "${MAX_MESSAGE_BYTES:-10485760}"
      MAX_ATTACHMENT_BYTES: "${MAX_ATTACHMENT_BYTES:-10485760}"
      DEV_MODE: "${DEV_MODE:-false}"
      API_KEY_DEFAULT_DAILY_LIMIT: "${API_KEY_DEFAULT_DAILY_LIMIT:-200000}"
      ALLOW_API_KEY_QUERY_PARAM: "${ALLOW_API_KEY_QUERY_PARAM:-false}"
      CONFIG_ENV_PATH: "/app/storage/.env"
    volumes:
      - ./data/app:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    entrypoint: ["sh", "-ec", "if [ -z \"$$POSTGRES_PASSWORD\" ] || [ \"$$POSTGRES_PASSWORD\" = \"local-dev-only-change-me\" ]; then echo 'POSTGRES_PASSWORD must be set in .env for docker compose deployments.' >&2; exit 1; fi; exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hloolmail}"
      POSTGRES_USER: "${POSTGRES_USER:-hloolmail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-dev-only-change-me}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
